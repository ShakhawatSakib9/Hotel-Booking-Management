<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Arrow marker for data flows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d00000"/>
    </marker>
    <!-- Shadow filter for processes and entities -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <path d="M 185 375 L 535 375" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360.0" y="367.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Search &amp; Booking (Room/Car/Travel)</text>
  <path d="M 185 390 L 535 390" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360.0" y="382.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Chat Messages</text>
  <path d="M 535 410 L 185 410" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360.0" y="422.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Booking Confirmation &amp; Chat Reply</text>
  <path d="M 185 595 L 545 440" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365.0" y="505.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Global Settings</text>
  <path d="M 545 455 L 185 610" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365.0" y="544.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Platform Reports</text>
  <path d="M 1015 200 L 660 335" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="837.5" y="255.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Hotel, Room &amp; Car Data</text>
  <path d="M 665 350 L 1015 220" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840.0" y="297.0" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Booking Alerts &amp; Chat Msgs</text>
  <path d="M 665 420 L 1005 555" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="835.0" y="475.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Payment Details</text>
  <path d="M 1005 570 L 665 435" fill="none" stroke="#d00000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="835.0" y="514.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">Payment Auth</text>
  <circle cx="600" cy="390" r="65" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="360" font-size="13" font-weight="bold" text-anchor="middle" fill="#555555">0</text>
  <text x="600" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Multi-Manage</text>
  <text x="600" y="398" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Booking System</text>
  <rect x="75.0" y="365.0" width="110" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Customer</text>
  <rect x="75.0" y="585.0" width="110" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="615" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Admin</text>
  <rect x="1015.0" y="185.0" width="110" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Manager</text>
  <rect x="1005.0" y="545.0" width="130" height="50" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070" y="575" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Payment Gateway</text>
</svg>
